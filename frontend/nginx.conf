# nginx 站点配置（容器内 /etc/nginx/conf.d/default.conf）
# 2026-10-19 启用 HTTPS：Let's Encrypt 证书由 acme.sh 签发，续期后自动 reload 本容器
server {
    listen 80;
    server_name yizhiyu.me www.yizhiyu.me _;

    # Let's Encrypt 域名验证（ACME webroot 模式，续期也走这里）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 域名访问一律升级 HTTPS；IP 直连保留 HTTP（证书对 IP 不生效）
    if ($host ~* ^(www\.)?yizhiyu\.me$) {
        return 301 https://$host$request_uri;
    }

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA 路由回退（关键！）：刷新 /articles、/admin 等前端路由时不 404
        # 浏览器请求的路径在 dist 里不存在 → 一律返回 index.html，由 Vue Router 接管
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端容器
    location /api {
        # backend 是 docker compose 网络内的服务名（不是 127.0.0.1！）
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS 站点
server {
    listen 443 ssl;
    http2 on;
    server_name yizhiyu.me www.yizhiyu.me;

    ssl_certificate     /etc/letsencrypt/live/yizhiyu.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yizhiyu.me/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS：告诉浏览器一年内只用 HTTPS 访问本站（含 www 子域）
    # ⚠️ 一旦下发，浏览器会记住 1 年，期间强退到 HTTP 也会被浏览器改成 HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        # backend 是 docker compose 网络内的服务名（不是 127.0.0.1！）
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
