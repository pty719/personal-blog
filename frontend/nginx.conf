# nginx 站点配置（容器内 /etc/nginx/conf.d/default.conf）
server {
    listen 80;
    server_name _;

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA 路由回退（关键！）：刷新 /articles、/admin 等前端路由时不 404
        # 浏览器请求的路径在 dist 里不存在 → 一律返回 index.html，由 Vue Router 接管
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端容器
    location /api {
        # backend 是 docker compose 网络内的服务名（不是 127.0.0.1！）
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
