<!DOCTYPE html>
<!-- 前端入口 HTML：Vite 的"门面"，真正的内容都在 src/ 里 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 移动端适配：让页面在小屏幕上不缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yizhiyu的小站</title>
  </head>
  <body>
    <!-- #app 是 Vue 挂载点：main.js 会把整个应用渲染进这个 div -->
    <div id="app"></div>
    <!-- 加载 src/main.js（type=module 是 ES 模块标准写法） -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
