<!DOCTYPE html>
<!-- 前端入口 HTML：Vite 的"门面"，真正的内容都在 src/ 里 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 移动端适配：让页面在小屏幕上不缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="yizhiyu的小站 —— 智能体应用开发者的个人博客与作品集：文章、说说、项目，以及可对话、能检索的 AI 助手。" />
    <meta name="theme-color" content="#f9f8f6" />
    <title>yizhiyu的小站</title>
    <!-- 站点图标（favicon）：public/ 下的文件会被 Vite 原样拷到 dist 根目录，路径就是 /favicon.xxx -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 静态页脚样式（备案信息必须在 HTML 源码中可见，供备案审查/爬虫核查） -->
    <style>
      #site-footer {
        text-align: center;
        padding: 40px 16px;
        font-size: 12px;
        letter-spacing: 0.1em;
        color: rgba(74, 63, 53, 0.4);
        border-top: 1px solid rgba(74, 63, 53, 0.1);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      #site-footer p { margin: 6px 0; }
      #site-footer a { color: inherit; text-decoration: none; }
      #site-footer a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <!-- #app 是 Vue 挂载点：main.js 会把整个应用渲染进这个 div -->
    <div id="app"></div>
    <!-- 静态页脚：ICP 备案号（法定要求展示在网站底部，且必须出现在 HTML 源码中） -->
    <footer id="site-footer">
      <p>&copy; 2026 小站 · FastAPI + Vue3 求职作品</p>
      <p>
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">湘ICP备2026040639号-1</a>
        &nbsp;·&nbsp;
        <!-- 公安备案（2026-10-19 通过）：湘公网安备43011102002783号，图标为官方警徽 beian-police.png -->
        <a href="https://beian.mps.gov.cn/#/query/webSearch?code=43011102002783" target="_blank" rel="noopener">
          <img src="/beian-police.png" alt="公安备案图标" style="width:12px;height:13px;vertical-align:-2px;border:0" />
          湘公网安备43011102002783号
        </a>
      </p>
    </footer>
    <!-- 加载 src/main.js（type=module 是 ES 模块标准写法） -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
